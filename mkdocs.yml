site_name: dflockd
site_url: https://mtingers.github.io/dflockd/
site_description: A distributed FIFO lock server with leases and semaphores. Speaks a line-based TCP protocol and an optional HTTP REST API on top of the same shared state.
repo_url: https://github.com/mtingers/dflockd
repo_name: mtingers/dflockd

theme:
  name: material
  palette:
    - media: "(prefers-color-scheme: light)"
      scheme: default
      primary: slate
      accent: indigo
      toggle:
        icon: material/brightness-7
        name: Switch to dark mode
    - media: "(prefers-color-scheme: dark)"
      scheme: slate
      primary: slate
      accent: indigo
      toggle:
        icon: material/brightness-4
        name: Switch to light mode
  features:
    - navigation.tabs
    - navigation.tabs.sticky
    - navigation.instant
    - navigation.sections
    - search.suggest
    - search.highlight
    - content.code.copy
    - content.tabs.link

plugins:
  - search

markdown_extensions:
  - admonition
  - pymdownx.details
  - pymdownx.highlight:
      anchor_linenums: true
  - pymdownx.superfences
  - pymdownx.tabbed:
      alternate_style: true
  - pymdownx.snippets:
      check_paths: true
  - pymdownx.inlinehilite
  - attr_list
  - md_in_html
  - tables
  - toc:
      permalink: true

nav:
  - Home: index.md
  - Getting Started:
    - Installation: getting-started/installation.md
    - Quick Start: getting-started/quickstart.md
    - Examples: getting-started/examples.md
  - Server:
    - Configuration: server.md
    - HTTP API: http-api.md
  - Client:
    - Go Client: client.md
  - Architecture:
    - Overview: architecture/overview.md
    - Wire Protocol: architecture/protocol.md
  - Changelog: changelog.md

extra_css:
  - stylesheets/extra.css
